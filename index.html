<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radial SEO Keyword Wheel Explorer (fixed v4)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 0; background: #0b0f19; color: #f1f5f9;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  #top-bar {
    background: rgba(17,24,39,.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid #1f2937; padding: 12px 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; z-index: 10;
  }
  select, input, button {
    background: #111827; border: 1px solid #374151; color: #fff;
    padding: 9px 13px; border-radius: 6px; font-size: 14px; outline: none;
    transition: all .2s;
  }
  input { width: 280px; border-color: #0070f3; }
  input:focus { box-shadow: 0 0 0 2px rgba(0,112,243,.35); }
  select, button { cursor: pointer; }
  button { background: #0070f3; border: none; font-weight: 500; }
  button:hover { background: #0051cb; }
  button.secondary { background: #1f2937; }
  button.secondary:hover { background: #374151; }
  #status { font-size: 13px; color: #9ca3af; font-style: italic; flex: 1 1 100%; margin-top: 4px; }
  #canvas-container { flex: 1; position: relative; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }
  .node circle {
    fill: #0b0f19; stroke: #0070f3; stroke-width: 2px; cursor: pointer;
    transition: r .15s, fill .15s, stroke .15s;
  }
  .node:hover circle { r: 9px; fill: #0070f3; stroke: #fff; }
  .node--root circle { fill: #0070f3; stroke: #fff; r: 12px; }
  .node text {
    font-size: 11px; fill: #9ca3af; pointer-events: none;
    transition: fill .15s; paint-order: stroke;
    stroke: #0b0f19; stroke-width: 3px; stroke-linejoin: round;
  }
  .node:hover text { fill: #fff; }
  .node--root text { fill: #fff; font-weight: 600; font-size: 13px; }
  .link { fill: none; stroke: #1f2937; stroke-width: 1.5px; transition: stroke .2s, stroke-width .2s; }
  .link--strong { stroke: #0070f3; stroke-width: 2.5px; }
</style>
</head>
<body>

<div id="top-bar">
  <select id="modelSelect">
    <option value="simulation">Fast Simulation (no download)</option>
    <option value="onnx-community/SmolLM2-135M-Instruct-ONNX-MHA">SmolLM2 135M ONNX (EN, ~270MB)</option>
    <option value="onnx-community/Qwen2.5-0.5B-Instruct">Qwen 2.5 0.5B ONNX (RU/EN, ~950MB)</option>
  </select>
  <input type="text" id="promptInput" value="how to choose a mattress for">
  <button id="runBtn">Initialize Core</button>
  <button id="resetBtn" class="secondary">Reset</button>
  <button id="exportBtn" class="secondary">Export CSV</button>
  <div id="status">Enter a phrase and click Initialize.</div>
</div>

<div id="canvas-container">
  <svg id="wheelSvg"></svg>
</div>

<script type="module">
/* ============================================================
 *  Импорты: работаем с AutoModelForCausalLM напрямую,
 *  чтобы избежать бага pipeline "e.map is not a function"
 * ============================================================ */
import {
  AutoModelForCausalLM,
  AutoTokenizer,
  env
} from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

// Отключаем поиск локальных моделей (иначе браузер тянет localhost/models/*.json → HTML → JSON.parse падает)
env.allowLocalModels = false;
env.useBrowserCache = true;

/* ============================================================
 *  Утилиты: детерминированный random для воспроизводимой симуляции
 * ============================================================ */
function hashString(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed) {
  const rnd = mulberry32(seed);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function truncate(str, n) {
  return str.length > n ? str.slice(0, n - 1) + '…' : str;
}

/* ============================================================
 *  Глобальное состояние
 * ============================================================ */
let treeData = null;
let model = null;
let tokenizer = null;
let currentModelId = null;

const svg = d3.select("#wheelSvg");
const g = svg.append("g");

// Единственный zoom behavior — переиспользуем везде
const zoomBehavior = d3.zoom()
  .scaleExtent([0.15, 4])
  .on("zoom", (event) => g.attr("transform", event.transform));
svg.call(zoomBehavior);

let width = 0, height = 0;
function updateDimensions() {
  const rect = document.getElementById('canvas-container').getBoundingClientRect();
  width = rect.width;
  height = rect.height;
  svg.attr("width", width).attr("height", height);
}
updateDimensions();
window.addEventListener('resize', () => {
  updateDimensions();
  if (treeData) drawRadialTree();
});

/* ============================================================
 *  UI-хуки
 * ============================================================ */
const modelSelect = document.getElementById('modelSelect');
const promptInput = document.getElementById('promptInput');
const statusEl = document.getElementById('status');

modelSelect.addEventListener('change', (e) => {
  const v = e.target.value;
  if (v === 'simulation') promptInput.value = "how to choose a mattress for";
  else if (v.includes('Qwen')) promptInput.value = "как выбрать ортопедический матрас для";
  else promptInput.value = "how to choose a mattress for";
});

document.getElementById('runBtn').addEventListener('click', initializeCore);
promptInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') initializeCore(); });
document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('exportBtn').addEventListener('click', exportToCSV);

/* ============================================================
 *  Загрузка модели через AutoModelForCausalLM
 * ============================================================ */
async function ensureModelLoaded(modelId) {
  if (model && currentModelId === modelId) return;

  statusEl.innerText = `Downloading weights for ${modelId} (first run only)...`;

  // Освобождаем предыдущую модель
  model = null;
  tokenizer = null;
  currentModelId = modelId;

  tokenizer = await AutoTokenizer.from_pretrained(modelId);

  // Пробуем WebGPU, при неудаче — WASM (CPU)
  try {
    model = await AutoModelForCausalLM.from_pretrained(modelId, {
      device: 'webgpu',
      dtype: 'fp32'
    });
  } catch (e) {
    console.warn('WebGPU failed, falling back to WASM:', e);
    model = await AutoModelForCausalLM.from_pretrained(modelId, {
      device: 'wasm',
      dtype: 'fp32'
    });
  }
}

/* ============================================================
 *  Инициализация дерева
 * ============================================================ */
async function initializeCore() {
  const rootPhrase = promptInput.value.trim();
  if (!rootPhrase) return;

  const mode = modelSelect.value;
  statusEl.innerText = "Initializing...";

  if (mode !== 'simulation') {
    try {
      await ensureModelLoaded(mode);
    } catch (err) {
      console.error('Model load failed:', err);
      statusEl.innerText = `Model load failed: ${err.message}. Falling back to simulation.`;
      modelSelect.value = 'simulation';
    }
  }

  treeData = { name: rootPhrase, fullPath: rootPhrase, children: null };
  await expandNodeLayer(treeData);
  drawRadialTree();

  svg.call(zoomBehavior.transform,
    d3.zoomIdentity.translate(width / 2, height / 2).scale(0.9));
}

function resetAll() {
  treeData = null;
  g.selectAll("*").remove();
  svg.call(zoomBehavior.transform, d3.zoomIdentity);
  statusEl.innerText = "Reset. Enter a phrase and click Initialize.";
}

/* ============================================================
 *  Раскрытие узла: симуляция ИЛИ реальная модель
 * ============================================================ */
async function expandNodeLayer(node) {
  const mode = modelSelect.value;
  statusEl.innerText = `Calculating next tokens for: "${node.fullPath}"`;

  if (mode === 'simulation') {
    await new Promise(r => setTimeout(r, 250));
    const isRussian = /[а-яА-Я]/.test(node.fullPath);
    const poolEN = ["back pain", "side sleepers", "kids", "heavy people",
                    "couples", "allergies", "spine health", "budget",
                    "luxury sleep", "toddlers", "neck support", "firmness"];
    const poolRU = ["ребенка", "болей в спине", "двуспальной кровати",
                    "подростка", "пожилых людей", "съемной квартиры",
                    "новорожденного", "здорового сна", "жесткости", "наполнителя"];
    const pool = isRussian ? poolRU : poolEN;

    const seed = hashString(node.fullPath);
    const picks = seededShuffle(pool, seed).slice(0, 5);
    const rnd = mulberry32(seed ^ 0x9E3779B9);

    node.children = picks.map((word, idx) => {
      const prob = Math.max(3, 45 - idx * 7 - Math.floor(rnd() * 5));
      return {
        name: `${word} (${prob}%)`,
        fullPath: `${node.fullPath} ${word}`,
        children: null
      };
    });
  } else {
    try {
      // 1. Токенизируем входную фразу
      const inputs = await tokenizer(node.fullPath, { return_tensors: 'pt' });

      // 2. Прямой вызов модели — получаем сырые логиты
      const outputs = await model(inputs);

      // 3. Достаём тензор логитов. Формат: [batch, seq_len, vocab]
      const logits = outputs.logits;

      // 4. Нам нужен вектор логитов для ПОСЛЕДНЕГО токена в последовательности
      const seqLen = logits.dims[1];
      const vocabSize = logits.dims[2];

      // Извлекаем последний вектор логитов (позиция seq_len - 1)
      const lastTokenLogits = new Float32Array(vocabSize);
      const offset = (seqLen - 1) * vocabSize;
      for (let i = 0; i < vocabSize; i++) {
        lastTokenLogits[i] = logits.data[offset + i];
      }

      const { indices, values } = getTopK(lastTokenLogits, 5);
      node.children = [];

      for (let i = 0; i < indices.length; i++) {
        const tokenIndex = indices[i];
        const probability = Math.round(values[i] * 100);

        // Декодируем ID токена в текст вручную
        let word = tokenizer.decode([tokenIndex], { skip_special_tokens: true });
        word = word.replace(/[ĠĊ]/g, ' ').replace(/<\|.*?\|>/g, '').trim();
        if (!word) continue;

        const nextPath = /[\s]$/.test(node.fullPath) || /^\s/.test(word)
          ? `${node.fullPath}${word}`
          : `${node.fullPath} ${word}`;

        node.children.push({
          name: `${word} (${probability}%)`,
          fullPath: nextPath.trim(),
          children: null
        });
      }

      if (node.children.length === 0) {
        node.children = [{ name: '∅ (end)', fullPath: node.fullPath, children: null }];
      }
    } catch (e) {
      console.error("Inference error:", e);
      statusEl.innerText = `Inference error: ${e.message}`;
      return;
    }
  }

  statusEl.innerText = "Wheel tier expanded. Click an outer node to branch further.";
}

/* ============================================================
 *  Top-K из логитов (Softmax)
 * ============================================================ */
function getTopK(logitsData, k) {
  // logitsData: Float32Array или обычный массив чисел
  const data = logitsData;

  let maxLogit = -Infinity;
  for (let i = 0; i < data.length; i++) if (data[i] > maxLogit) maxLogit = data[i];

  let sum = 0;
  const exps = new Float64Array(data.length);
  for (let i = 0; i < data.length; i++) {
    const e = Math.exp(data[i] - maxLogit);
    exps[i] = e;
    sum += e;
  }

  const idx = Array.from({ length: data.length }, (_, i) => i);
  idx.sort((a, b) => exps[b] - exps[a]);

  const topIdx = idx.slice(0, k);
  return {
    indices: topIdx,
    values: topIdx.map(i => exps[i] / sum)
  };
}

/* ============================================================
 *  Отрисовка радиального дерева
 * ============================================================ */
function drawRadialTree() {
  if (!treeData) return;

  g.selectAll("*").remove();

  const root = d3.hierarchy(treeData, d => d.children);
  const radius = Math.min(width, height) / 2 - 160;

  // cluster вместо tree — равномернее распределяет листья по кругу
  const radialLayout = d3.cluster()
    .size([2 * Math.PI, Math.max(80, radius)])
    .separation((a, b) => {
      const depth = Math.max(1, a.depth);
      return ((a.parent === b.parent ? 1 : 2.2) / depth);
    });

  radialLayout(root);

  function radialPoint(x, y) {
    const angle = x - Math.PI / 2;
    return [y * Math.cos(angle), y * Math.sin(angle)];
  }

  // Связи
  g.selectAll(".link")
    .data(root.links())
    .enter()
    .append("path")
    .attr("class", d => {
      const m = /\((\d+)%\)/.exec(d.target.data.name || "");
      const p = m ? parseInt(m[1], 10) : 0;
      return p >= 30 ? "link link--strong" : "link";
    })
    .attr("d", d3.linkRadial().angle(d => d.x).radius(d => d.y));

  // Узлы
  const node = g.selectAll(".node")
    .data(root.descendants())
    .enter()
    .append("g")
    .attr("class", d => "node" + (d.depth === 0 ? " node--root" : ""))
    .attr("transform", d => `translate(${radialPoint(d.x, d.y)})`);

  node.append("circle")
    .attr("r", d => d.depth === 0 ? 12 : 5)
    .on("click", async (event, d) => {
      event.stopPropagation();
      if (!d.data.children) {
        await expandNodeLayer(d.data);
        drawRadialTree();
      }
    });

  // Подписи с обрезкой, tooltip и stroke-halo для читаемости
  node.append("text")
    .attr("dy", "0.31em")
    .attr("x", d => d.x < Math.PI ? 12 : -12)
    .attr("text-anchor", d => d.x < Math.PI ? "start" : "end")
    .attr("transform", d => d.depth === 0 ? "" : `rotate(${d.x * 180 / Math.PI - 90})`)
    .text(d => truncate(d.data.name, 22))
    .append("title")
    .text(d => d.data.name);
}

/* ============================================================
 *  Экспорт в CSV
 * ============================================================ */
function exportToCSV() {
  if (!treeData) return;
  const rows = [["keyword", "probability_pct", "depth", "path"]];

  function walk(node, depth) {
    if (depth > 0) {
      const m = /\((\d+)%\)$/.exec(node.name || "");
      const prob = m ? m[1] : "";
      const keyword = (node.name || "").replace(/\s*\(\d+%\)$/, "");
      rows.push([keyword, prob, depth, node.fullPath || ""]);
    }
    if (node.children) node.children.forEach(c => walk(c, depth + 1));
  }
  walk(treeData, 0);

  const csv = rows.map(r =>
    r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")
  ).join("\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "seo-wheel.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  statusEl.innerText = `Exported ${rows.length - 1} keywords to seo-wheel.csv`;
}
</script>
</body>
</html>
