<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radial SEO Keyword Wheel Explorer (v9 stable)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 0; background: #0b0f19; color: #f1f5f9;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  #top-bar {
    background: rgba(17,24,39,.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid #1f2937; padding: 12px 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; z-index: 10;
  }
  select, input, button {
    background: #111827; border: 1px solid #374151; color: #fff;
    padding: 9px 13px; border-radius: 6px; font-size: 14px; outline: none;
    transition: all .2s;
  }
  input { width: 260px; border-color: #0070f3; }
  input:focus { box-shadow: 0 0 0 2px rgba(0,112,243,.35); }
  select, button { cursor: pointer; }
  button { background: #0070f3; border: none; font-weight: 500; }
  button:hover { background: #0051cb; }
  button:disabled { background: #374151; cursor: wait; opacity: .6; }
  button.secondary { background: #1f2937; }
  button.secondary:hover { background: #374151; }
  #status { font-size: 13px; color: #9ca3af; font-style: italic; flex: 1 1 100%; margin-top: 4px; }
  #canvas-container { flex: 1; position: relative; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }

  .depth-ring { fill: none; stroke: #1f2937; stroke-width: 1; stroke-dasharray: 2 6; opacity: .6; }
  .link { fill: none; stroke: #1f2937; stroke-width: 1.4px; }

  .node circle {
    fill: #0b0f19; stroke: #0070f3; stroke-width: 2px; cursor: pointer;
    transition: r .15s, fill .15s, stroke .15s;
  }
  .node:hover circle { r: 9px; fill: #0070f3; stroke: #fff; }
  .node--root circle { fill: #0070f3; stroke: #fff; }
  .node--root text { fill: #fff; font-weight: 600; font-size: 13px; }

  .node text {
    font-size: 11px; fill: #9ca3af; pointer-events: none;
    paint-order: stroke;
    stroke: #0b0f19; stroke-width: 3px; stroke-linejoin: round;
    transition: fill .15s;
  }
  .node:hover text { fill: #fff; }
</style>
</head>
<body>

<div id="top-bar">
  <select id="modelSelect">
    <option value="simulation">Fast Simulation (no download)</option>
    <option value="onnx-community/Qwen2.5-0.5B-Instruct">Qwen 2.5 0.5B (RU/EN, ~950MB)</option>
    <option value="onnx-community/SmolLM2-135M-Instruct-ONNX-MHA">SmolLM2 135M (EN, ~270MB)</option>
  </select>
  <input type="text" id="promptInput" value="buy the phone">
  <button id="runBtn">Initialize Core</button>
  <button id="resetBtn" class="secondary">Reset</button>
  <button id="fitBtn" class="secondary">Fit</button>
  <button id="exportBtn" class="secondary">Export CSV</button>
  <div id="status">Enter a phrase and click Initialize.</div>
</div>

<div id="canvas-container">
  <svg id="wheelSvg"></svg>
</div>

<script type="module">
import {
  pipeline,
  AutoTokenizer,
  env
} from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

env.allowLocalModels = false;
env.useBrowserCache = true;

/* ============================================================
 *  Геометрия
 * ============================================================ */
const LEVEL_STEP = 180;
const LABEL_PADDING = 180;
const MAX_LABEL_LEN = 22;

/* ============================================================
 *  Стоп-слова
 * ============================================================ */
const STOPWORDS = new Set([
  "a","an","the","and","or","but","of","to","in","on","at","for","with","by",
  "is","are","was","were","be","been","being","this","that","these","those",
  "it","its","he","she","they","them","we","us","you","your","my","i","me",
  "as","if","so","do","does","did","done","have","has","had","will","would",
  "can","could","should","may","might","must","not","no","yes","also","just",
  "from","into","about","than","then","only","very","more","most","some",
  "и","в","во","не","что","он","на","я","с","со","как","а","то","все","она",
  "так","его","но","да","ты","к","у","же","вы","за","бы","по","только","ее",
  "мне","было","вот","от","меня","еще","нет","о","из","ему","теперь","когда",
  "даже","ну","вдруг","ли","если","уже","или","ни","быть","был","него","до",
  "вас","нибудь","опять","уж","вам","ведь","там","потом","себя","ничего",
  "ей","может","они","тут","где","есть","надо","ней","для","мы","тебя","их",
  "чем","была","сам","чтоб","без","будто","чего","раз","тоже","себе","под",
  "будет","ж","тогда","кто","этот","того","потому","этого","какой","совсем",
  "ним","здесь","этом","один","почти","мой","тем","чтобы","нее","сейчас",
  "были","куда","зачем","всех","никогда","можно","при","наконец","два","об",
  "другой","хоть","после","над","больше","тот","через","эти","нас","про",
  "всего","них","какая","много","разве","три","эту","моя","впрочем","хорошо",
  "свою","этой","перед","иногда","лучше","чуть","том","нельзя","такой","им",
  "более","всегда","конечно","всю","между",
]);

/* ============================================================
 *  Утилиты
 * ============================================================ */
function truncate(str, n) {
  return str.length > n ? str.slice(0, n - 1) + '…' : str;
}
function isMeaningful(word) {
  const clean = word.trim().toLowerCase();
  if (!clean || clean.length < 2) return false;
  if (STOPWORDS.has(clean)) return false;
  if (/^[^\p{L}\p{N}]+$/u.test(clean)) return false;
  return true;
}
function hashString(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed) {
  const rnd = mulberry32(seed);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================
 *  Состояние
 * ============================================================ */
let treeData = null;
let generator = null;
let tokenizer = null;
let currentModelId = null;
let busy = false;

const svg = d3.select("#wheelSvg");
const g = svg.append("g");
const zoomBehavior = d3.zoom()
  .scaleExtent([0.08, 4])
  .on("zoom", (event) => g.attr("transform", event.transform));
svg.call(zoomBehavior);

let width = 0, height = 0;
function updateDimensions() {
  const rect = document.getElementById('canvas-container').getBoundingClientRect();
  width = rect.width;
  height = rect.height;
  svg.attr("width", width).attr("height", height);
}
updateDimensions();
window.addEventListener('resize', () => {
  updateDimensions();
  if (treeData) drawRadialTree({ fit: true });
});

/* ============================================================
 *  UI
 * ============================================================ */
const modelSelect = document.getElementById('modelSelect');
const promptInput = document.getElementById('promptInput');
const statusEl = document.getElementById('status');
const runBtn = document.getElementById('runBtn');

runBtn.addEventListener('click', initializeCore);
promptInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') initializeCore(); });
document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('fitBtn').addEventListener('click', () => { if (treeData) drawRadialTree({ fit: true }); });
document.getElementById('exportBtn').addEventListener('click', exportToCSV);

/* ============================================================
 *  Загрузка модели — pipeline (стабильно)
 * ============================================================ */
async function ensureModelLoaded(modelId) {
  if (generator && currentModelId === modelId) return;
  statusEl.innerText = `Downloading ${modelId} (first run only)...`;
  generator = null; tokenizer = null; currentModelId = modelId;

  tokenizer = await AutoTokenizer.from_pretrained(modelId);

  try {
    generator = await pipeline('text-generation', modelId, { device: 'webgpu' });
    console.log('Model loaded on WebGPU');
  } catch (e) {
    console.warn('WebGPU failed, falling back to WASM:', e);
    statusEl.innerText = 'WebGPU недоступен, использую WASM...';
    generator = await pipeline('text-generation', modelId, { device: 'wasm' });
  }
}

/* ============================================================
 *  Chat-шаблон — используем возможности токенизатора
 * ============================================================ */
function buildPrompt(userContent, modelId) {
  if (tokenizer.apply_chat_template) {
    try {
      return tokenizer.apply_chat_template(
        [
          { role: 'system', content: 'You are a SEO keyword research assistant. Reply with only the list, one item per line, no numbering, no explanations.' },
          { role: 'user', content: userContent }
        ],
        { tokenize: false, add_generation_prompt: true }
      );
    } catch (e) {
      console.warn('apply_chat_template failed:', e);
    }
  }
  if (modelId.includes('Qwen') || modelId.includes('SmolLM')) {
    return `<|im_start|>system\nYou are a SEO keyword research assistant. Reply with only the list, one item per line, no numbering.<|im_end|>\n<|im_start|>user\n${userContent}<|im_end|>\n<|im_start|>assistant\n`;
  }
  return `User: ${userContent}\nAssistant:`;
}

/* ============================================================
 *  Инициализация / сброс
 * ============================================================ */
async function initializeCore() {
  if (busy) return;
  const rootPhrase = promptInput.value.trim();
  if (!rootPhrase) return;

  busy = true;
  runBtn.disabled = true;

  try {
    const mode = modelSelect.value;
    statusEl.innerText = "Initializing...";

    if (mode !== 'simulation') {
      try {
        await ensureModelLoaded(mode);
      } catch (err) {
        console.error('Model load failed:', err);
        statusEl.innerText = `Model load failed: ${err.message}. Using simulation.`;
        modelSelect.value = 'simulation';
      }
    }

    treeData = { name: rootPhrase, fullPath: rootPhrase, children: null };
    await expandNodeLayer(treeData);
    drawRadialTree({ fit: true });
  } finally {
    busy = false;
    runBtn.disabled = false;
  }
}

function resetAll() {
  if (busy) return;
  treeData = null;
  g.selectAll("*").remove();
  svg.interrupt().transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity);
  statusEl.innerText = "Reset.";
}

/* ============================================================
 *  Раскрытие узла
 * ============================================================ */
async function expandNodeLayer(node) {
  if (busy) return;
  const mode = modelSelect.value;
  statusEl.innerText = `Generating related queries for: "${node.fullPath}"`;

  if (mode === 'simulation') {
    await new Promise(r => setTimeout(r, 300));
    const isRussian = /[а-яА-Я]/.test(node.fullPath);
    const poolEN = ["phone case", "phone repair", "cheap phone", "phone screen protector",
                    "best budget phone", "unlocked phone", "phone plans", "used phone",
                    "phone holder", "phone charger", "phone deals", "smartphone"];
    const poolRU = ["чехол для телефона", "ремонт телефона", "недорогой смартфон",
                    "защитное стекло", "лучший бюджетный телефон", "телефон без контракта",
                    "тарифы на связь", "б/у телефон", "держатель для телефона",
                    "зарядка для телефона", "скидки на телефоны", "смартфон"];
    const pool = isRussian ? poolRU : poolEN;
    const seed = hashString(node.fullPath);
    const picks = seededShuffle(pool, seed).slice(0, 6);
    node.children = picks.map(q => ({ name: q, fullPath: q, children: null }));
    return;
  }

  busy = true;
  runBtn.disabled = true;

  try {
    const userContent = `Generate 8 realistic Google search queries that a person looking for "${node.fullPath}" might also type. Each query: 2-6 words. Output ONLY the queries, one per line, no numbering, no bullets, no explanation.`;
    const prompt = buildPrompt(userContent, mode);

    statusEl.innerText = `Model is thinking about "${node.fullPath}"...`;

    // Простой вызов pipeline БЕЗ опций, которые ломали batch_decode
    const output = await generator(prompt, {
      max_new_tokens: 120,
      do_sample: true,
      temperature: 0.85,
      top_k: 40,
      top_p: 0.9,
      repetition_penalty: 1.15,
      return_full_text: false,
    });

    const text = output[0].generated_text || '';
    console.log('Raw model output:', JSON.stringify(text));

    // Парсинг
    const lines = text.split(/[\n\r]+/).map(l => l.trim()).filter(Boolean);
    const queries = [];
    for (const line of lines) {
      let cleaned = line.replace(/^[-*•·\d.)\]]+\s*/, '').trim();
      cleaned = cleaned.replace(/^["'`]+|["'`]+$/g, '').trim();
      cleaned = cleaned.split(/\s[—–-]\s/)[0].trim();

      if (cleaned.length < 3 || cleaned.length > 70) continue;
      const words = cleaned.split(/\s+/).filter(Boolean);
      if (words.length < 1 || words.length > 8) continue;
      const meaningfulCount = words.filter(w => isMeaningful(w)).length;
      if (meaningfulCount < 1) continue;
      if (/[.!?]$/.test(cleaned)) continue;

      queries.push(cleaned);
    }

    const seen = new Set();
    const unique = queries.filter(q => {
      const k = q.toLowerCase();
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });

    if (unique.length === 0) {
      statusEl.innerText = `No valid queries. Raw: "${text.slice(0, 80)}"`;
      node.children = [{ name: '(no results)', fullPath: node.fullPath, children: null }];
    } else {
      node.children = unique.slice(0, 6).map(q => ({
        name: q, fullPath: q, children: null
      }));
      statusEl.innerText = `Got ${node.children.length} related queries. Click any to expand.`;
    }
  } catch (e) {
    console.error("Inference error:", e);
    statusEl.innerText = `Inference error: ${e.message}`;
  } finally {
    busy = false;
    runBtn.disabled = false;
  }
}

/* ============================================================
 *  Отрисовка
 * ============================================================ */
function drawRadialTree({ fit = false } = {}) {
  if (!treeData) return;
  g.selectAll("*").remove();

  const root = d3.hierarchy(treeData, d => d.children);
  const radialLayout = d3.tree()
    .size([2 * Math.PI, 1])
    .separation((a, b) => a.parent === b.parent ? 1.5 : 2.8);
  radialLayout(root);

  root.each(d => { d.radius = d.depth * LEVEL_STEP; });

  for (let i = 1; i <= root.height; i++) {
    g.append("circle").attr("class", "depth-ring").attr("r", i * LEVEL_STEP);
  }

  function toXY(angle, radius) {
    const a = angle - Math.PI / 2;
    return [radius * Math.cos(a), radius * Math.sin(a)];
  }

  g.selectAll(".link")
    .data(root.links())
    .enter()
    .append("path")
    .attr("class", "link")
    .attr("d", d3.linkRadial().angle(d => d.x).radius(d => d.radius));

  const node = g.selectAll(".node")
    .data(root.descendants())
    .enter()
    .append("g")
    .attr("class", d => "node" + (d.depth === 0 ? " node--root" : ""))
    .attr("transform", d => {
      const [x, y] = toXY(d.x, d.radius);
      return `translate(${x},${y})`;
    });

  node.append("circle")
    .attr("r", d => d.depth === 0 ? 13 : 5)
    .on("click", async (event, d) => {
      event.stopPropagation();
      if (busy) return;
      if (!d.data.children || d.data.children.length === 0) {
        await expandNodeLayer(d.data);
        drawRadialTree({ fit: true });
      }
    });

  node.append("text")
    .attr("dy", "0.32em")
    .attr("x", d => d.x < Math.PI ? 11 : -11)
    .attr("text-anchor", d => d.x < Math.PI ? "start" : "end")
    .attr("transform", d => {
      if (d.depth === 0) return "";
      const deg = d.x * 180 / Math.PI - 90;
      return d.x > Math.PI ? `rotate(${deg + 180})` : `rotate(${deg})`;
    })
    .text(d => truncate(d.data.name, MAX_LABEL_LEN))
    .append("title")
    .text(d => d.data.name);

  if (fit) {
    const maxR = d3.max(root.descendants(), d => d.radius) || LEVEL_STEP;
    const needed = maxR + LABEL_PADDING;
    const avail = Math.min(width, height) / 2 - 30;
    const scale = Math.max(0.08, Math.min(1.6, avail / needed));

    svg.interrupt();
    svg.transition().duration(400).call(
      zoomBehavior.transform,
      d3.zoomIdentity.translate(width / 2, height / 2).scale(scale)
    );
  }
}

/* ============================================================
 *  CSV
 * ============================================================ */
function exportToCSV() {
  if (!treeData) return;
  const rows = [["keyword", "depth", "parent"]];
  function walk(node, depth, parent) {
    if (depth > 0) rows.push([node.name, depth, parent || ""]);
    if (node.children) node.children.forEach(c => walk(c, depth + 1, node.name));
  }
  walk(treeData, 0, "");

  const csv = rows.map(r =>
    r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")
  ).join("\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "seo-wheel.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  statusEl.innerText = `Exported ${rows.length - 1} keywords.`;
}
</script>
</body>
</html>
